name: Governance validation

on:
  push:
    branches: [main, "governance/**", "feature/**", "inventory/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate relative Markdown links and image paths
        run: python scripts/validate_docs.py
      - name: Check Python syntax
        run: python -m py_compile scripts/validate_docs.py scripts/build_inventory.py scripts/validate_task_manifest.py
      - name: Run inventory unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate microtask manifest
        run: python scripts/validate_task_manifest.py
      - name: Self-test microtask manifest validator
        run: python scripts/validate_task_manifest.py --self-test
