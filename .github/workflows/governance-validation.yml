name: Governance validation

on:
  push:
    branches: [main, "governance/**", "feature/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: governance-docs-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate relative Markdown links and image paths
        run: python scripts/validate_docs.py
      - name: Check validator syntax
        run: python -m py_compile scripts/validate_docs.py scripts/validate_task_manifest.py
      - name: Validate microtask manifest
        run: python scripts/validate_task_manifest.py
      - name: Test microtask manifest validator
        run: python scripts/validate_task_manifest.py --self-test
